name: darwin-supply-chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: supply-chain-policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify supply-chain policy
        run: python3 scripts/verify_supply_chain.py --repo .
      - name: Compile Python sources
        run: python3 -m compileall -q core events ledger memory children evolution experiments opportunities scripts

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
